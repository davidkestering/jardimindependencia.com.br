<dialog id="dlg-cat" style="border:0;border-radius:12px;padding:24px;max-width:420px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.25)">
  <form method="post" action="/admin/categorias" id="f-cat">
    <input type="hidden" name="voltar" value="{{ voltar }}">
    <h3 style="margin-top:0">Nova categoria de documento</h3>
    <label>Nome<input name="nome" required maxlength="80" placeholder="Ex.: Laudos técnicos"></label>
    <p class="aviso" id="cat-erro" hidden style="margin:10px 0 0"></p>
    <p style="display:flex;gap:8px;margin:12px 0 0"><button class="btn" type="submit">Salvar</button><button class="btn sec" type="button" onclick="document.getElementById('dlg-cat').close()">Cancelar</button></p>
  </form>
</dialog>
<script>
  // Cria a categoria por fetch e atualiza os selects na hora: o formulário de envio (arquivos escolhidos, título…) não é perdido.
  (function () {
    const dlg = document.getElementById('dlg-cat'), f = document.getElementById('f-cat'), erro = document.getElementById('cat-erro');
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); erro.hidden = true;
      try {
        const r = await fetch(f.action, { method: 'POST', body: new FormData(f), headers: { Accept: 'application/json' } });
        const j = await r.json();
        if (!r.ok) { erro.textContent = j.erro || 'Não foi possível salvar.'; erro.hidden = false; return; }
        document.querySelectorAll('select[name="categoria"]').forEach(sel => {
          sel.replaceChildren(...j.categorias.map(c => new Option(c, c, false, c === j.nome)));
        });
        f.reset(); dlg.close();
      } catch { f.submit(); }  // sem rede/JSON: cai no envio normal com recarga
    });
  })();
</script>
